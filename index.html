<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Hub v7 Enterprise - 完全版</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif; }
    body { background: #F4F6FA; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.6); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: #FFF; borderRadius: 20px; padding: 32px; width: 100%; maxWidth: 500px; maxHeight: 90vh; overflow: auto; boxShadow: 0 25px 60px rgba(0,0,0,.15); }
    input, textarea, select { padding: 10px 14px; borderRadius: 10px; border: 1px solid #E2E8F0; fontSize: 14px; fontFamily: inherit; width: 100%; marginBottom: 12px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;
    const root = ReactDOM.createRoot(document.getElementById('root'));

    function App() {
      const [view, setView] = useState("dashboard");
      const [modal, setModal] = useState(null);
      const [formData, setFormData] = useState({});

      const [deals] = useState([
        { id: "d1", name: "ホテルグランヴィア 秋季派遣", amount: 5000000, stage: "商談", probability: 80, assignee: "松永" },
        { id: "d2", name: "ウェスティン 通年契約", amount: 10000000, stage: "契約", probability: 100, assignee: "松永" },
        { id: "d3", name: "新規ホテルチェーン拡大", amount: 3000000, stage: "提案", probability: 45, assignee: "田仭" },
        { id: "d4", name: "レストラン求人紹介", amount: 800000, stage: "完了", probability: 100, assignee: "佐藤" },
      ]);

      const [clients] = useState([
        { id: "c1", company: "ホテルグランヴィア京都", status: "商談中", contacts: 2, projects: [
          { id: "p1", name: "秋季ホテル人材確保", tasks: [
            { id: "t1", title: "求人票作成", status: "完了", priority: "高" },
            { id: "t2", title: "候補者リストアップ", status: "進行仭", priority: "高" }
          ]}
        ]},
        { id: "c2", company: "ウェスティンホテル東京", status: "契約中", contacts: 1, projects: [] },
      ]);

      const [users] = useState([
        { id: "u1", username: "owner", role: "オーナー" },
        { id: "u2", username: "admin", role: "管理者" },
        { id: "u3", username: "member", role: "メンバー" },
      ]);

      const [messages, setMessages] = useState([]);
      const [rules] = useState([
        { id: "r1", name: "確度80%以上の案件を自動フォローアップ" },
        { id: "r2", name: "月末になったら集計レポートを自動作成" },
      ]);

      const handleSendMessage = () => {
        if(formData.title && formData.recipients > 0) {
          setMessages([...messages, { id: Date.now(), ...formData, sentAt: new Date().toLocaleString('ja-JP') }]);
          setFormData({});
          setModal(null);
        }
      };
      const NavBar = () => (<nav style={{ width: 280, background: "linear-gradient(180deg, #0F172A, #1E293B)", color: "#F1F5F9", padding: "24px 20px", display: "flex", flexDirection: "column", overflowY: "auto", borderRight: "1px solid rgba(255,255,255,.1)" }}><div style={{ marginBottom: 24 }}><div style={{ fontSize: 10, fontWeight: 700, color: "#3B82F6", marginBottom: 4, letterSpacing: ".08em" }}>DAIEI SERVICE</div><div style={{ fontSize: 14, fontWeight: 800 }}>Business Hub</div><div style={{ fontSize: 11, color: "#94A3B8", marginTop: 4 }}>v7 Enterprise</div></div><div style={{ flex: 1 }}>{[{{key: "dashboard", label: "📊 トップページ"},{key: "pipeline", label: "🎯 パイプライン"},{key: "clients", label: "🏢 クライアント"},{key: "projects", label: "📁 プロジェクト"},{key: "schedule", label: "📅 スケジュール"},{key: "dm", label: "📤 DM送信"},{key: "analytics", label: "📈 分析・レポート"},{key: "users", label: "👩 member"},{key: "automation", label: "⚙️ auto"}].map(item => (<div key={item.key} onClick={() => setView(item.key)} style={{ padding: "12px 16px", cursor: "pointer", background: view === item.key ? "rgba(59, 130, 246, 0.15)" : "transparent", borderLeft: view === item.key ? "3px solid #3B82F6" : "3px solid transparent", marginBottom: 8, borderRadius: 6, fontSize: 12, fontWeight: view === item.key ? 600 : 400, color: view === item.key ? "#F1F5F9" : "#94A3B8" }}>{item.label}</div>))}</div></nav>);
      return (<div style={{ display: "flex", height: "100vh" }}><NavBar /><main style={{ flex: 1, overflow: "auto", padding: 28, background: "#FFF" }}>{view === "dashboard" && (<div><h1 style={{ fontSize: 28, fontWeight: 800 }}>📊 トップページ</h1><div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14, margin: "20px 0" }}>{[{label: "売上", value: "¥18.8M", color: "#10B981"},{label: "商談", value: "1件", color: "#3B82F6"},{label: "成約", value: "1件", color: "#8B5CF6"},{label: "確度", value: "81%", color: "#F59E0B"}].map((i,k)=>(<div key={k} style={{background:"#FFF",borderRadius:16,border:"1px solid #F1F5F9",padding:20}}><div style={{fontSize:12,color:"#94A3B8",marginBottom:8}}>{i.label}</div><div style={{fontSize:24,fontWeight:800,color:i.color}}>{i.value}</div></div>))}</div></div>)}{view === "pipeline" && (<div><h1 style={{fontSize:28,fontWeight:800}}>🎯 パイプライン</h1><div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14}}>{["提案","商諗","契約","完了"].map(s=>(<div key={s} style={{background:"#F8FAFC",borderRadius:14,padding:16}}><h3 style={{fontSize:14,fontWeight:700}}>{s}</h3>{deals.filter(d=>d.stage===s).map(d=>(<div key={d.id} style={{background:"#FFF",padding:10,borderRadius:8,marginTop:6,border:`2px solid ${d.probability>70?"#22C55E":"#F59E0B"}`,fontSize:11}}>{d.name}</div>))}</div>))}</div></div>)}{view==="clients"&&(<div><h1 style={{fontSize:28,fontWeight:800}}>🏢 クライアント</h1>{clients.map(c=>(<div key={c.id} style={{background:"#FFF",borderRadius:16,border:"1px solid #F1F5F9",padding:20,marginBottom:12}}><h3 style={{fontSize:15}}>{c.company}</h3><p>{c.status} / 連絡: {c.contacts}名</p></div>))}</div>)}{view==="projects"&&(<div><h1 style={{fontSize:28,fontWeight:800}}>📁 プロジェクト</h1>{clients.filter(c=>c.projects.length>0).map(c=>(<div key={c.id} style={{marginBottom:20}}><h3 style={{fontSize:16}}>{c.company}</h3>{c.projects.map(p=>(<div key={p.id} style={{background:"#F8FAFC",padding:16,borderRadius:12}}><h4>{p.name}</h4><div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>{["未着手","進行中","完了"].map(st=>(<div key={st} style={{background:"#FFF",padding:12,borderRadius:8}}><div style={{fontWeight:600}}>{st}</div>{p.tasks.filter(t=>t.status===st).map(t=>(<div key={t.id} style={{fontSize:11,padding:4,background:"#F1F5F9",borderRadius:4,marginTop:4}}>{t.title}</div>))}</div>))}</div></div>))}</div>))}</div>)}{view==="schedule"&&(<div><h1 style={{fontSize:28,fontWeight:800}}>📅 スケジュール</h1><div style={{background:"#F8FAFC",padding:20,borderRadius:16}}><p>🔗 Google Calendar 連携</p><p style={{fontSize:12,color:"#64748B"}}>ユーザー {users.length}名のカレンダーを統合表示</p></div></div>)}{view==="dm"&&(<div><h1 style={{fontSize:28,fontWeight:800}}>📤 DM送信</h1><button onClick={()=>setModal("sendDM")} style={{padding:"10px 20px",background:"#3B82F6",color:"#FFF",border:"none",borderRadius:10,fontWeight:600,cursor:"pointer"}}>📨 新規メッセージ</button>{messages.length>0&&(<div style={{marginTop:20}}>{messages.map(m=>(<div key={m.id} style={{padding:12,background:"#F8FAFC",borderRadius:8,marginBottom:8}}><strong>{m.title}</strong><br/>{m.sentAt}</div>))}</div>)}</div>)}{view==="analytics"&&(<div><h1 style={{fontSize:28,fontWeight:800}}>📈 分析</h1><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}><div style={{padding:16,background:"linear-gradient(135deg,#EFF6FF,#E0E7FF)",borderRadius:12}}><div style={{fontSize:12,color:"#1E40AF"}}>総取引額</div><div style={{fontSize:28,fontWeight:800,color:"#3B82F6"}}>¥{(deals.reduce((s,d)=>s+d.amount,0)/1e6).toFixed(1)}M</div></div><div style={{padding:16,background:"linear-gradient(135deg,#F0FDF4,#DCFCE7)",borderRadius:12}}><div style={{fontSize:12,color:"#166534"}}>成約</div><div style={{fontSize:28,fontWeight:800,color:"#22C55E"}}>{deals.filter(d=>d.stage==="完了").length}件</div></div></div></div>)}{view==="users"&&(<div><h1 style={{fontSize:28,fontWeight:800}}>👩 member</h1>{users.map(u=>(<div key={u.id} style={{padding:16,borderBottom:"1px solid #F1F5F9",display:"flex",justifyContent:"space-between"}}><div><div style={{fontWeight:600}}>{u.username}</div><div style={{fontSize:12,color:"#64748B"}}>{u.role}</div></div></div>))}</div>)}{view==="automation"&&(<div><h1 style={{fontSize:28,fontWeight:800}}>⚩️ 自動化</h1>{rules.map(r=>(<div key={r.id} style={{padding:16,borderBottom:"1px solid #F1F5F9",display:"flex",alignItems:"center",gap:12}}><div style={{width:20,height:20,borderRadius:"50%",background:"#22C55E",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{color:"#FFF",fontSize:12}}>✓</span></div><div style={{fontWeight:600}}>{r.name}</div></div>))}</div>)}</main>{modal==="sendDM"&&(<div style={{position:"fixed",inset:0,background:"rgba(15,23,42,.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000}} onClick={()=>setModal(null)}><div style={{background:"#FFF",borderRadius:20,padding:32,width:500,maxHeight:"90vh",overflow:"auto"}} onClick={e=>e.stopPropagation()}><h2 style={{fontSize:18,fontWeight:700,marginBottom:20}}>📨 新規メッセージ</h2><input placeholder="件名" value={formData.title||""} onChange={e=>setFormData({...formData,title:e.target.value})} style={{width:"100%",padding:"10px 14px",borderRadius:10,border:"1px solid #E2E8F0",marginBottom:12,fontSize:14}}/><button onClick={()=>{if(formData.title){setMessages([...messages,{id:Date.now(),title:formData.title,sentAt:new Date().toLocaleString('ja-JP')}]);setFormData({});setModal(null)}}} style={{padding:"10px 20px",background:"#3B82F6",color:"#FFF",border:"none",borderRadius:8,fontWeight:600,cursor:"pointer"}}>送信</button></div></div>)}</div>);
    }
    root.render(<App />);
  </script>
</body>
</html>
